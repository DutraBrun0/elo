# Sobe o Elo completo: http://localhost:8080
#   cp .env.example .env   # defina JWT_SECRET
#   docker compose up --build
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - elo-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Arquivo SQLite persistido entre reinícios dos containers.
  elo-data:

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes do back-end
        run: npm test

      - name: Build do front-end
        run: npm run build --workspace web

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Valida o docker-compose
        run: JWT_SECRET=ci-segredo-com-mais-de-32-caracteres-123 docker compose config -q

      - name: Build da API
        run: docker build -f server/Dockerfile -t elo-api .

      - name: Build do front-end
        run: docker build -f web/Dockerfile -t elo-web .
